name: 공개 검색 문서 최신화 확인

on:
    workflow_dispatch:
    schedule:
        - cron: "17 3 * * 1"

permissions:
    contents: read

concurrency:
    group: knowledge-source-refresh
    cancel-in-progress: true

jobs:
    verify:
        runs-on: ubuntu-latest
        timeout-minutes: 10
        env:
            GITHUB_TOKEN: ${{ github.token }}
        steps:
            - uses: actions/checkout@v4
            - uses: actions/setup-node@v4
              with:
                  node-version-file: .nvmrc
                  cache: npm
            - name: 의존성 설치
              run: npm ci
            - name: 공개 문서와 검색 자료 갱신
              run: |
                  npm run knowledge:refresh-docs
                  npm run knowledge:generate
            - name: 원격 문서 변경 확인
              run: git diff --exit-code -- docs/knowledge-document-snapshots.json public/knowledge/portfolio.json
            - name: 변경 자료 보관
              if: failure()
              uses: actions/upload-artifact@v4
              with:
                  name: knowledge-source-refresh
                  path: |
                      docs/knowledge-document-snapshots.json
                      public/knowledge/portfolio.json
                  if-no-files-found: error
