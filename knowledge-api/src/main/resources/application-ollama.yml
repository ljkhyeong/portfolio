knowledge:
    ai:
        provider: ollama
        embedding-model-id: ${OLLAMA_EMBEDDING_MODEL:bge-m3}
        embedding-dimensions: ${OLLAMA_EMBEDDING_DIMENSIONS:1024}

spring:
    ai:
        model:
            chat: ollama
            embedding: ollama
        ollama:
            base-url: ${OLLAMA_URL:http://localhost:11434}
            init:
                pull-model-strategy: never
            chat:
                model: ${OLLAMA_CHAT_MODEL:qwen3:8b}
                temperature: 0.2
            embedding:
                model: ${knowledge.ai.embedding-model-id}
        retry:
            # Spring AI 2.0은 이 값을 재시도 횟수로 쓴다. 기본 10회면 Ollama 장애 때 답변 요청 하나가 20분 넘게 대기한다.
            max-attempts: 0
