knowledge:
    ai-gateway:
        account-id: ${CLOUDFLARE_ACCOUNT_ID}
        gateway-id: ${CLOUDFLARE_AI_GATEWAY_ID}
        token: ${CLOUDFLARE_AI_GATEWAY_TOKEN}

spring:
    ai:
        openai:
            base-url: https://gateway.ai.cloudflare.com/v1/${knowledge.ai-gateway.account-id}/${knowledge.ai-gateway.gateway-id}/openai
            custom-headers:
                cf-aig-authorization: Bearer ${knowledge.ai-gateway.token}
                cf-aig-skip-cache: "true"
                cf-aig-collect-log-payload: "false"
                cf-aig-max-attempts: "1"
