spring:
    application:
        name: portfolio-knowledge-api
    profiles:
        group:
            # Gateway 프로필은 OpenAI 설정의 요청 주소만 바꾸므로 openai 프로필을 함께 켠다.
            ai-gateway: openai
    elasticsearch:
        uris: ${ELASTICSEARCH_URL:http://localhost:9200}
        username: ${ELASTICSEARCH_USERNAME:}
        password: ${ELASTICSEARCH_PASSWORD:}
        connection-timeout: 3s
        socket-timeout: 10s
    http:
        clients:
            imperative:
                # Elasticsearch 클라이언트가 함께 가져온 HttpClient 5로 Ollama 전송 계층이 바뀌지 않게 고정한다.
                factory: reactor
    ai:
        model:
            chat: none
            embedding: none
            image: none
            moderation: none
            audio:
                speech: none
                transcription: none

server:
    port: ${PORT:8080}
    # 사설망·루프백 프록시가 덧붙인 X-Forwarded-For를 Tomcat RemoteIpValve가 오른쪽부터 해석한다.
    forward-headers-strategy: native

management:
    endpoint:
        health:
            group:
                readiness:
                    include: readinessState,elasticsearch
