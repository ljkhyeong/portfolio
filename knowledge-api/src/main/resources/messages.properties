# Spring MVC 표준 오류(RFC 9457)의 detail 문구. 인자가 있는 예외는 MessageFormat을 거치므로 작은따옴표를 쓰지 않는다.
problemDetail.org.springframework.web.servlet.NoHandlerFoundException=요청한 주소를 찾을 수 없습니다.
problemDetail.org.springframework.web.servlet.resource.NoResourceFoundException=요청한 주소를 찾을 수 없습니다.
problemDetail.org.springframework.web.HttpRequestMethodNotSupportedException=지원하지 않는 HTTP 메소드입니다.
problemDetail.org.springframework.web.HttpMediaTypeNotSupportedException=Content-Type은 application/json을 사용해 주세요.
problemDetail.org.springframework.web.HttpMediaTypeNotAcceptableException=응답 형식은 application/json만 지원합니다.
problemDetail.org.springframework.http.converter.HttpMessageNotReadableException=JSON 요청 형식을 확인해 주세요.
problemDetail.org.springframework.http.converter.HttpMessageNotWritableException=요청을 처리하지 못했습니다.
problemDetail.org.springframework.web.bind.MethodArgumentNotValidException=요청 값을 확인해 주세요.
