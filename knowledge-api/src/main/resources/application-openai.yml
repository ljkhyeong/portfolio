knowledge:
    elasticsearch:
        index-name: ${ELASTICSEARCH_INDEX:portfolio-knowledge-openai-v2}
    ai:
        provider: openai
        embedding-model-id: ${OPENAI_EMBEDDING_MODEL:text-embedding-3-large}
        embedding-dimensions: ${OPENAI_EMBEDDING_DIMENSIONS:1024}

spring:
    ai:
        model:
            chat: openai
            embedding: openai
        openai:
            api-key: ${OPENAI_API_KEY}
            chat:
                model: ${OPENAI_CHAT_MODEL:gpt-5-mini}
            embedding:
                model: ${OPENAI_EMBEDDING_MODEL:text-embedding-3-large}
                dimensions: ${OPENAI_EMBEDDING_DIMENSIONS:1024}
        retry:
            max-attempts: 2
            backoff:
                initial-interval: 500ms
                max-interval: 2s
                multiplier: 2
