services:
    elasticsearch:
        image: portfolio-knowledge-elasticsearch:9.4.8-nori
        build:
            context: .
            dockerfile: elasticsearch.Dockerfile
        environment:
            discovery.type: single-node
            xpack.security.enabled: "false"
            ES_JAVA_OPTS: -Xms768m -Xmx768m
        ports:
            - "127.0.0.1:9200:9200"
        volumes:
            - portfolio-knowledge-es:/usr/share/elasticsearch/data
        healthcheck:
            test:
                [
                    "CMD-SHELL",
                    "curl -fsS http://localhost:9200/_cluster/health >/dev/null || exit 1",
                ]
            interval: 10s
            timeout: 5s
            retries: 20

    knowledge-api:
        build:
            context: ..
            dockerfile: knowledge-api/Dockerfile
        depends_on:
            elasticsearch:
                condition: service_healthy
        restart: unless-stopped
        environment:
            # 관리 포트 9091, 지표 노출과 시작 시 동기화는 AI 프로필과 무관하게 항상 적용한다.
            SPRING_PROFILES_INCLUDE: homeserver
            ELASTICSEARCH_URL: http://elasticsearch:9200
            OLLAMA_URL: http://ollama:11434
            # 값이 없는 항목은 셸이나 .env에 있을 때만 전달하고, 없으면 애플리케이션 기본값을 사용합니다.
            SPRING_PROFILES_ACTIVE:
            KNOWLEDGE_SOURCE_MAX_BYTES:
            KNOWLEDGE_SYNC_ON_STARTUP:
            KNOWLEDGE_SYNC_KEY:
            KNOWLEDGE_CORS_ALLOWED_ORIGINS:
            KNOWLEDGE_TURNSTILE_ENABLED:
            KNOWLEDGE_TURNSTILE_SECRET_KEY:
            KNOWLEDGE_TURNSTILE_EXPECTED_HOSTNAMES:
            KNOWLEDGE_AI_ANSWER_CACHE_TTL_SECONDS:
            KNOWLEDGE_AI_ANSWER_CACHE_MAX_ENTRIES:
            KNOWLEDGE_RATE_LIMIT_GLOBAL_ANSWERS_PER_MINUTE:
            KNOWLEDGE_RATE_LIMIT_CLIENT_ANSWERS_PER_MINUTE:
            KNOWLEDGE_RATE_LIMIT_GLOBAL_SEARCHES_PER_MINUTE:
            KNOWLEDGE_RATE_LIMIT_CLIENT_SEARCHES_PER_MINUTE:
            KNOWLEDGE_RATE_LIMIT_MAX_CLIENTS_PER_MINUTE:
            OPENAI_API_KEY:
            OPENAI_CHAT_MODEL:
            OPENAI_EMBEDDING_MODEL:
            OPENAI_EMBEDDING_DIMENSIONS:
            OPENAI_REQUEST_TIMEOUT:
            OPENAI_MAX_COMPLETION_TOKENS:
            CLOUDFLARE_ACCOUNT_ID:
            CLOUDFLARE_AI_GATEWAY_ID:
            CLOUDFLARE_AI_GATEWAY_TOKEN:
            OLLAMA_CHAT_MODEL:
            OLLAMA_EMBEDDING_MODEL:
            OLLAMA_EMBEDDING_DIMENSIONS:
        ports:
            - "127.0.0.1:8080:8080"
            - "127.0.0.1:9091:9091"
        healthcheck:
            test:
                [
                    "CMD-SHELL",
                    "curl -fsS --max-time 3 http://localhost:9091/actuator/health/readiness >/dev/null || exit 1",
                ]
            interval: 10s
            timeout: 5s
            retries: 6
            start_period: 20s

    ollama:
        image: ollama/ollama:0.11.4
        profiles: ["ollama"]
        volumes:
            - portfolio-knowledge-ollama:/root/.ollama
        ports:
            - "127.0.0.1:11434:11434"

volumes:
    portfolio-knowledge-es:
    portfolio-knowledge-ollama:
