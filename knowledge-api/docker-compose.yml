services:
    elasticsearch:
        image: portfolio-knowledge-elasticsearch:8.19.20-nori
        build:
            context: .
            dockerfile: elasticsearch.Dockerfile
        environment:
            discovery.type: single-node
            xpack.security.enabled: "false"
            ES_JAVA_OPTS: -Xms768m -Xmx768m
        ports:
            - "127.0.0.1:9200:9200"
        volumes:
            - portfolio-knowledge-es:/usr/share/elasticsearch/data
        healthcheck:
            test:
                [
                    "CMD-SHELL",
                    "curl -fsS http://localhost:9200/_cluster/health >/dev/null || exit 1",
                ]
            interval: 10s
            timeout: 5s
            retries: 20

    knowledge-api:
        build:
            context: ..
            dockerfile: knowledge-api/Dockerfile
        depends_on:
            elasticsearch:
                condition: service_healthy
        restart: unless-stopped
        environment:
            AI_PROFILE: ${AI_PROFILE:-disabled}
            SPRING_PROFILES_ACTIVE: ${SPRING_PROFILES_ACTIVE:-${AI_PROFILE:-}}
            ELASTICSEARCH_URL: http://elasticsearch:9200
            ELASTICSEARCH_INDEX: ${ELASTICSEARCH_INDEX:-portfolio-knowledge-${AI_PROFILE:-disabled}-v3}
            KNOWLEDGE_SOURCE_LOCATION: ${KNOWLEDGE_SOURCE_LOCATION:-classpath:knowledge/portfolio.json}
            KNOWLEDGE_SOURCE_CONNECT_TIMEOUT_SECONDS: ${KNOWLEDGE_SOURCE_CONNECT_TIMEOUT_SECONDS:-3}
            KNOWLEDGE_SOURCE_READ_TIMEOUT_SECONDS: ${KNOWLEDGE_SOURCE_READ_TIMEOUT_SECONDS:-10}
            KNOWLEDGE_SOURCE_MAX_BYTES: ${KNOWLEDGE_SOURCE_MAX_BYTES:-8388608}
            KNOWLEDGE_SYNC_ON_STARTUP: ${KNOWLEDGE_SYNC_ON_STARTUP:-true}
            KNOWLEDGE_ALLOW_EMPTY: ${KNOWLEDGE_ALLOW_EMPTY:-false}
            KNOWLEDGE_SYNC_KEY: ${KNOWLEDGE_SYNC_KEY:-}
            KNOWLEDGE_CORS_ALLOWED_ORIGINS: ${KNOWLEDGE_CORS_ALLOWED_ORIGINS:-http://localhost:5173,https://ljkportfolio.netlify.app}
            KNOWLEDGE_TURNSTILE_ENABLED: ${KNOWLEDGE_TURNSTILE_ENABLED:-false}
            KNOWLEDGE_TURNSTILE_SECRET_KEY: ${KNOWLEDGE_TURNSTILE_SECRET_KEY:-}
            KNOWLEDGE_TURNSTILE_EXPECTED_HOSTNAMES: ${KNOWLEDGE_TURNSTILE_EXPECTED_HOSTNAMES:-ljkportfolio.netlify.app}
            OPENAI_API_KEY: ${OPENAI_API_KEY:-}
            CLOUDFLARE_ACCOUNT_ID: ${CLOUDFLARE_ACCOUNT_ID:-}
            CLOUDFLARE_AI_GATEWAY_ID: ${CLOUDFLARE_AI_GATEWAY_ID:-}
            CLOUDFLARE_AI_GATEWAY_TOKEN: ${CLOUDFLARE_AI_GATEWAY_TOKEN:-}
            OPENAI_CHAT_MODEL: ${OPENAI_CHAT_MODEL:-gpt-5-mini}
            OPENAI_EMBEDDING_MODEL: ${OPENAI_EMBEDDING_MODEL:-text-embedding-3-large}
            OPENAI_EMBEDDING_DIMENSIONS: ${OPENAI_EMBEDDING_DIMENSIONS:-1024}
            OPENAI_REQUEST_TIMEOUT: ${OPENAI_REQUEST_TIMEOUT:-30s}
            OPENAI_SDK_MAX_RETRIES: ${OPENAI_SDK_MAX_RETRIES:-0}
            AI_RETRY_MAX_ATTEMPTS: ${AI_RETRY_MAX_ATTEMPTS:-2}
            OPENAI_MAX_COMPLETION_TOKENS: ${OPENAI_MAX_COMPLETION_TOKENS:-2000}
            OLLAMA_URL: http://ollama:11434
            OLLAMA_CHAT_MODEL: ${OLLAMA_CHAT_MODEL:-qwen3:8b}
            OLLAMA_EMBEDDING_MODEL: ${OLLAMA_EMBEDDING_MODEL:-bge-m3}
            OLLAMA_EMBEDDING_DIMENSIONS: ${OLLAMA_EMBEDDING_DIMENSIONS:-1024}
            AI_GLOBAL_ANSWERS_PER_MINUTE: ${AI_GLOBAL_ANSWERS_PER_MINUTE:-30}
            AI_CLIENT_ANSWERS_PER_MINUTE: ${AI_CLIENT_ANSWERS_PER_MINUTE:-5}
            AI_ANSWER_CACHE_TTL_SECONDS: ${AI_ANSWER_CACHE_TTL_SECONDS:-120}
            AI_ANSWER_CACHE_MAX_ENTRIES: ${AI_ANSWER_CACHE_MAX_ENTRIES:-128}
            AI_GLOBAL_SEARCHES_PER_MINUTE: ${AI_GLOBAL_SEARCHES_PER_MINUTE:-300}
            AI_CLIENT_SEARCHES_PER_MINUTE: ${AI_CLIENT_SEARCHES_PER_MINUTE:-30}
            AI_MAX_CLIENT_BUCKETS_PER_MINUTE: ${AI_MAX_CLIENT_BUCKETS_PER_MINUTE:-100}
            AI_TRUST_PROXY_HEADERS: ${AI_TRUST_PROXY_HEADERS:-false}
            MANAGEMENT_SERVER_PORT: 9091
            MANAGEMENT_SERVER_ADDRESS: 0.0.0.0
            MANAGEMENT_ENDPOINTS_WEB_EXPOSURE_INCLUDE: health,info,metrics,prometheus
        ports:
            - "127.0.0.1:8080:8080"
            - "127.0.0.1:9091:9091"
        healthcheck:
            test:
                [
                    "CMD-SHELL",
                    "curl -fsS --max-time 3 http://localhost:9091/actuator/health/readiness >/dev/null || exit 1",
                ]
            interval: 10s
            timeout: 5s
            retries: 6
            start_period: 20s

    ollama:
        image: ollama/ollama:0.11.4
        profiles: ["ollama"]
        volumes:
            - portfolio-knowledge-ollama:/root/.ollama
        ports:
            - "127.0.0.1:11434:11434"

volumes:
    portfolio-knowledge-es:
    portfolio-knowledge-ollama:
